[workspace]
members = [
    "tankterm",
    "iced_tterm",
    "tankterm_terminal",
    "tankterm_config",
    "tankterm_config_derive",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95.0"

[profile.release]
lto = "thin"
debug = 1
incremental = false

[workspace.dependencies]
toml = "1.2.1"
toml_edit = "0.25.19"
