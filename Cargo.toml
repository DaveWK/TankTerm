[workspace]
members = [
    "tankterm",
    "tankterm_terminal",
    "tankterm_config",
    "tankterm_config_derive",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95.0"

[profile.release]
lto = "thin"
debug = 1
incremental = false

[workspace.dependencies]
toml = "1.2.1"
toml_edit = "0.25.19"

# TODO: Fix for alacritty/alacritty#6978, which isn't in an `x11-clipboard` release yet (0.9.3 still
# checks selection ownership after storing). Remove once a release includes it.
[patch.crates-io]
x11-clipboard = { git = "https://github.com/quininer/x11-clipboard.git", rev = "19ab2163cf0bd0db607e827a5214571990307866" }
