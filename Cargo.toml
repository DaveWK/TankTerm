[workspace]
members = [
    "crates/tankterm",
    "crates/iced_tterm",
    "crates/tankterm_terminal",
    "crates/tankterm_config",
    "crates/tankterm_config_derive",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95.0"

[profile.release]
lto = "thin"
incremental = false

[workspace.dependencies]
toml = "1.2.1"
toml_edit = "0.25.19"
