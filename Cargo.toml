[workspace]
members = [
    "tankterm",
    "tankterm_terminal",
    "tankterm_config",
    "tankterm_config_derive",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88.0"

[profile.release]
lto = "thin"
debug = 1
incremental = false

[workspace.dependencies]
toml = "1.2.1"
toml_edit = "0.25.19"

# iced_term depends on tankterm_terminal from this repository; use the local copy so there is only
# one terminal crate in the build.
[patch."https://github.com/DaveWK/TankTerm"]
tankterm_terminal = { path = "tankterm_terminal" }
