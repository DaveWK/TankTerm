[package]
name = "tankterm_config_derive"
version = "0.2.6-dev"
authors = ["Christian Duerr <contact@christianduerr.com>"]
license = "MIT OR Apache-2.0"
description = "Failure resistant deserialization derive"
homepage = "https://git.infra.xitely.net/xitely/TankTerm"
repository = "https://git.infra.xitely.net/xitely/TankTerm"
edition.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.10", features = ["derive", "parsing", "proc-macro", "printing"], default-features = false }

[dev-dependencies.tankterm_config]
path = "../tankterm_config"
version = "0.2.4-dev"

[dev-dependencies]
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
toml.workspace = true
