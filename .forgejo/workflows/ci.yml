# Basic checks, run on the xitely Fedora 44 runners for pushes to main and for
# pull requests: rustfmt, clippy and the tests at the minimum supported Rust
# version, and shellcheck.
#
# `fedora44` is the only label both runners carry (sbc-ci-tools
# ansible/inventory/host_vars). It is a host executor in the shared runner
# image, so jobs install no packages (the list is sbc-ci-tools
# runner/fedora44-runner-packages.txt) and never change the runner user's
# rustup default: the toolchain is chosen with RUSTUP_TOOLCHAIN.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The rustfmt options in rustfmt.toml need a nightly toolchain.
  RUSTFMT_TOOLCHAIN: nightly-2026-09-08

jobs:
  checks:
    name: Checks
    runs-on: fedora44
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Set up caches and the toolchain
        shell: bash
        run: |
          set -eu
          mkdir -p "$HOME/.cache/tankterm"
          echo "CARGO_TARGET_DIR=$HOME/.cache/tankterm/target" >> "$GITHUB_ENV"
          if command -v sccache > /dev/null; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"
          fi
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          echo "RUSTUP_TOOLCHAIN=${msrv}" >> "$GITHUB_ENV"
          rustup toolchain install "${msrv}" --profile minimal --component clippy
          rustup toolchain install "${RUSTFMT_TOOLCHAIN}" --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo "+${RUSTFMT_TOOLCHAIN}" fmt --all -- --check

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked --offline

      - name: Run tankterm_terminal tests without default features
        run: cargo test -p tankterm_terminal --no-default-features --locked --offline

      - name: Run shellcheck
        run: git ls-files -z '*.sh' '*.bash' | xargs -0 shellcheck
