image: archlinux

packages:
  - pkg-config
  - cmake
  - make
  - freetype2
  - fontconfig
  - libxcb
  - libxkbcommon
  - scdoc
  - groff

sources:
  - https://github.com/DaveWK/TankTerm

environment:
  PATH: /home/build/.cargo/bin:/usr/bin/

tasks:
  - rustup: |
      curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable --profile minimal
  - rustfmt: |
      cd TankTerm
      rustup toolchain install nightly -c rustfmt
      cargo +nightly fmt -- --check
  - man-pages: |
      cd TankTerm
      for page in extra/man/*.scd; do
        roff=$(extra/man/scdoc.sh "$page")
        warnings=$(printf '%s\n' "$roff" | groff -k -t -man -Tutf8 -ww -z 2>&1)
        [ -z "$warnings" ] || { echo "$page: $warnings"; exit 1; }
      done
  - test: |
      cd TankTerm
      cargo test
  - oldstable: |
      cd TankTerm
      oldstable=$(cat Cargo.toml | grep "rust-version" | sed 's/.*"\(.*\)".*/\1/')
      rustup toolchain install --profile minimal $oldstable
      rustup default $oldstable
      cargo test
  - clippy: |
      cd TankTerm
      rustup component add clippy
      cargo clippy --all-targets
  - feature-wayland: |
      cd TankTerm/tankterm
      RUSTFLAGS="-D warnings" cargo test --no-default-features --features=wayland
  - feature-x11: |
      cd TankTerm/tankterm
      RUSTFLAGS="-D warnings" cargo test --no-default-features --features=x11
