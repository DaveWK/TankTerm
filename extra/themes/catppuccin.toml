# Catppuccin, from https://catppuccin.com: Mocha when dark, Latte when light.

[colors.primary]
background = { light = "#eff1f5", dark = "#1e1e2e" }
foreground = { light = "#4c4f69", dark = "#cdd6f4" }
dim_foreground = { light = "#8c8fa1", dark = "#7f849c" }
