[package]
name = "tankterm"
version = "0.18.0-dev"
authors = ["Christian Duerr <contact@christianduerr.com>", "Joe Wilm <joe@jwilm.com>"]
license = "Apache-2.0"
description = "A fast, cross-platform terminal emulator"
readme = "README.md"
homepage = "https://git.infra.xitely.net/xitely/TankTerm"
repository = "https://git.infra.xitely.net/xitely/TankTerm"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "tankTerm"
path = "src/main.rs"

[dependencies.iced_tterm]
path = "../iced_tterm"
version = "0.8.0"

[dependencies.tankterm_terminal]
path = "../tankterm_terminal"
version = "0.26.1-dev"

[dependencies.tankterm_config_derive]
path = "../tankterm_config_derive"
version = "0.2.6-dev"

[dependencies.tankterm_config]
path = "../tankterm_config"
version = "0.2.4-dev"

[dependencies]
bitflags = "2.13.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossfont = "0.9.0"
home = "0.5.12"
iced = "0.14.0"
iced_core = "0.14.0"
iced_graphics = { version = "0.14.0", default-features = false }
libc = "0.2"
log = { version = "0.4", features = ["std", "serde"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9.34"
tempfile = "3.27.0"
toml.workspace = true
toml_edit.workspace = true
unicode-width = "0.2.3"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "serde"] }

[dev-dependencies]
clap_complete = "4.6.11"
iced_test = "0.14.0"

[target.'cfg(not(windows))'.dependencies]
xdg = "3.0.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
png = { version = "0.18.1", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSString",
    "NSLocale",
    "NSUserDefaults",
] }

[target.'cfg(windows)'.dependencies]
dirs = "7.0.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Foundation",
]}

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[features]
default = ["wayland", "x11"]
x11 = ["iced/x11", "winit/x11", "png"]
wayland = ["iced/wayland", "winit/wayland"]
nightly = []
