[package]
name = "tankterm"
version = "0.18.0-dev"
authors = ["Christian Duerr <contact@christianduerr.com>", "Joe Wilm <joe@jwilm.com>"]
license = "Apache-2.0"
description = "A fast, cross-platform, OpenGL terminal emulator"
readme = "README.md"
homepage = "https://github.com/DaveWK/TankTerm"
repository = "https://github.com/DaveWK/TankTerm"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "tankTerm"
path = "src/main.rs"

[dependencies.tankterm_terminal]
path = "../tankterm_terminal"
version = "0.26.1-dev"

[dependencies.tankterm_config_derive]
path = "../tankterm_config_derive"
version = "0.2.6-dev"

[dependencies.tankterm_config]
path = "../tankterm_config"
version = "0.2.4-dev"

[dependencies]
ahash = { version = "0.8.12", features = ["no-rng"] }
bitflags = "2.13.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
copypasta = { version = "0.10.2", default-features = false }
crossfont = "0.9.0"
glutin = { version = "0.32.3", default-features = false, features = ["egl", "wgl"] }
home = "0.5.12"
libc = "0.2"
log = { version = "0.4", features = ["std", "serde"] }
notify = "8.2.2"
parking_lot = "0.13.0"
polling = "3.11.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9.34"
signal-hook = { version = "0.4.6", default-features = false }
tempfile = "3.27.0"
toml.workspace = true
toml_edit.workspace = true
unicode-width = "0.2.3"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "serde"] }

[build-dependencies]
gl_generator = "0.14.0"

[dev-dependencies]
clap_complete = "4.6.11"

[target.'cfg(not(windows))'.dependencies]
xdg = "3.0.0"

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
arboard = { version = "3.7.0", default-features = false, optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
png = { version = "0.18.1", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSString",
    "NSLocale",
    "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSColorSpace",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[target.'cfg(windows)'.dependencies]
dirs = "7.0.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Foundation",
]}

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[features]
default = ["wayland", "x11"]
x11 = [
    "dep:arboard",
    "winit/x11",
    "glutin/x11",
    "glutin/glx",
    "png",
]
wayland = [
    "copypasta/wayland",
    "glutin/wayland",
    "winit/wayland",
    "winit/wayland-dlopen",
    "winit/wayland-csd-adwaita",
]
nightly = []
